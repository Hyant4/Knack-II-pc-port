name: Knack II checks

on:
  pull_request:
    paths:
      - 'run.py'
      - 'profiles/**'
      - 'port/build.sh'
      - 'port/shell.nix'
      - 'port/src/**'
      - 'port/gpu/**'
      - 'port/packaging/linux/**'
      - 'port/launcher/**'
      - 'port/scripts/**'
      - 'tests/**'
      - 'port/tests/**'
      - '.github/workflows/checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install EGL for Qt tests on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Install existing Python test dependencies
        run: python -m pip install iced-x86==1.21.0 PySide6-Essentials==6.12.0
      - name: Set up CLANG64 for Windows tests
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        id: msys2
        with:
          msystem: CLANG64
          release: false
          install: mingw-w64-clang-x86_64-clang
      - name: Configure Windows test paths
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CLANG64_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          "MSYS2_ROOT=$env:CLANG64_ROOT" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Knack II launcher and supervisor
        run: python -B -m unittest discover -s tests -p 'test_knack2*.py' -v
      - name: Preparation and linker
        shell: pwsh
        run: |
          foreach ($pattern in 'test_prepare.py', 'test_link_modules.py', 'test_link_libc.py') {
            python -B -m unittest discover -s port/tests -p $pattern -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  linux-native:
    runs-on: ubuntu-24.04
    container: fedora:44
    env:
      TLG_LTO: 'OFF'
      TLG_BUILD_JOBS: '2'
    steps:
      - name: Install Linux build dependencies
        run: >-
          dnf install -y git gcc gcc-c++ cmake ninja-build pkgconf-pkg-config
          vulkan-loader-devel SDL3-devel ffmpeg-free-devel freetype-devel
          fmt-devel boost-devel robin-map-devel xxhash-devel VulkanMemoryAllocator-devel
          glslang zydis-devel libX11-devel python3
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install native H.264 decoder
        run: |
          dnf install -y https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-44.noarch.rpm
          dnf install -y libavcodec-freeworld
      - name: Build Linux runtime and native test targets
        shell: bash
        run: |
          export TLG_BUILD_COMMIT="${GITHUB_SHA:0:12}"
          cmake -S port/gpu -B port/out-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTLG_PGO=off -DTLG_LTO="$TLG_LTO"
          cmake --build port/out-linux --parallel "$TLG_BUILD_JOBS" --target \
            tlg-probe runtime-test sema-test freeze-test videodec-test isa-sse4a-test isa-f16c-test
      - name: Run Linux native contracts
        shell: bash
        run: |
          export KNACK2_TEST_BUILD_DIR="$PWD/port/out-linux"
          python3 -B -m unittest discover -s port/tests -p test_runtime.py -v
          python3 -B -m unittest discover -s port/tests -p test_sema.py -v
          timeout 15 "$KNACK2_TEST_BUILD_DIR/freeze-test"
          timeout 60 "$KNACK2_TEST_BUILD_DIR/videodec-test" port/tests/data/tiny.h264
          timeout 60 "$KNACK2_TEST_BUILD_DIR/isa-sse4a-test"
          timeout 60 "$KNACK2_TEST_BUILD_DIR/isa-f16c-test"
      - name: Check Knack II LoadExec handoff
        run: |
          mkdir -p out
          gcc -std=c11 -Wall -Wextra -Werror -pthread -Iport/src tests/test_knack_loadexec.c port/src/runtime_knack.c -o out/knack-loadexec-test
          python3 -B -m unittest discover -s tests -p test_knack2.py -v
      - name: Check Knack II native font and save-data contracts
        run: |
          python3 -B -m unittest discover -s tests -p test_font.py -v
          python3 -B -m unittest discover -s tests -p test_savedata.py -v
