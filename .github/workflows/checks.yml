name: Knack II checks

on:
  pull_request:
    paths:
      - 'run.py'
      - 'port/launcher/**'
      - 'port/scripts/**'
      - 'tests/test_knack2*.py'
      - 'port/tests/**'
      - '.github/workflows/checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install existing Python test dependencies
        run: python -m pip install iced-x86==1.21.0 PySide6-Essentials==6.12.0
      - name: Knack II launcher and supervisor
        run: python -B -m unittest discover -s tests -p 'test_knack2*.py' -v
      - name: Preparation and linker
        shell: pwsh
        run: |
          foreach ($pattern in 'test_prepare.py', 'test_link_modules.py', 'test_link_libc.py') {
            python -B -m unittest discover -s port/tests -p $pattern -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
